# Once a week, or on demand: the tests on 386 and on the big-endian and
# 64-bit ARM architectures, and every fuzz target on amd64 and 386, with and
# without assertions, for five minutes each.
name: weekly

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architectures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Ubuntu's qemu-user-static, not docker/setup-qemu-action: the binfmt
      # image behind that action has no big-endian ppc64 or 32-bit mips.
      - name: qemu-user with binfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          for q in s390x ppc64 mips aarch64; do
            test -e /proc/sys/fs/binfmt_misc/qemu-$q || { echo "qemu-$q not registered"; exit 1; }
          done
      - name: 386, assertions
        run: GOARCH=386 go test -tags softmagic_assert -count=1 ./...
      - name: s390x, ppc64, mips and arm64 under qemu, assertions
        run: make emulated EMULATED="s390x ppc64 mips arm64"

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not go.mod's 1.26.0: before Go 1.27 the fuzzer can report its own
      # -fuzztime deadline as a failure ("context deadline exceeded",
      # go.dev/issue/75804). go.mod's minimum is still tested on every push.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: make fuzz FUZZTIME=5m
      - name: keep a failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: testdata/fuzz
